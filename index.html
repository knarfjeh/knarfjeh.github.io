
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knarfjeh – Min musik</title>
  <style>
    body {
      margin: 0;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;

    header {
      padding: 70px 20px 45px;

      margin-bottom: 10px;
    }

      margin: auto;
      padding: 20px;
    }
    section {
      background: #242424;
      border-radius: 14px;
      padding: 25px;

  <header>

  <main>
    <section>

      <p>Här samlar jag min egen musik.

    </section>

    <section>
  <h2>Mina låtar</h2>

  <div class="track">
    <h3>Min första låt</h3>
    <audio controls preload="metadata" style="width: 100%;">
      <source src="Osynlig_man.mp3" type="audio/mpeg">

</section>
  </main>

  <footer>

</html>
